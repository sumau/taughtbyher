# Fly.io deployment for Well Tutored. One machine serving the frontend and the
# API from a single origin. The database is external and reached through the
# DATABASE_URL secret. See docs/deploy.md for the full walkthrough, including
# the secrets this file deliberately omits.
#
# Create the app with `fly apps create`, which only reserves the name; `fly
# launch` rewrites this file from its own guesses. `app` is the Fly app's name,
# not a hostname: the domain lives in PUBLIC_ORIGIN and TRUSTED_ORIGINS below.

app = "welltutored"
primary_region = "lhr"

[build]
  dockerfile = "docker/Dockerfile"

  [build.args]
    # Read by the browser bundle, so it has to be present at build time rather
    # than set as a secret. Publishable keys are public values. Leave it empty
    # to deploy the public site without workspace sign-in.
    VITE_CLERK_PUBLISHABLE_KEY = "pk_test_cHJvbW90ZWQtY295b3RlLTM5MTAuY2xlcmsuYWNjb3VudHMuZGV2JA"

[env]
  PORT = "8080"
  # The Public Origin. Every other hostname — www, the .com, welltutored.fly.dev
  # — is redirected here, and the server refuses to start unless
  # TRUSTED_ORIGINS names it too.
  PUBLIC_ORIGIN = "https://welltutored.co.uk"
  # The exact origins allowed to make credentialed requests. Nothing infers
  # them, and an empty set rejects every one, enquiries included.
  TRUSTED_ORIGINS = "https://welltutored.co.uk"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/api/healthz"
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
